name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.30"
          enable-cache: true

      - name: Install locked test environment
        run: uv sync --locked --extra test

      - name: Resolve optional extras from binary wheels
        run: >-
          uv pip compile pyproject.toml --extra pdf --extra pro
          --only-binary :all:
          --output-file "${{ runner.temp }}/arxiv-extras.txt"

      - name: Run tests
        run: uv run pytest --cov-report=xml

      - name: Build candidate wheel
        run: uv build --wheel --out-dir dist

      - name: Smoke-test installed wheel over MCP
        run: uv run python scripts/smoke_installed_wheel.py

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag arxiv-mcp-server:ci .

      - name: Verify installed package
        run: |
          docker run --rm --entrypoint python arxiv-mcp-server:ci -c \
            "import importlib.metadata; print(importlib.metadata.version('arxiv-mcp-server'))"
